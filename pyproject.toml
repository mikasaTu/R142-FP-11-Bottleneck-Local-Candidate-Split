[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r142-bottleneck-split"
version = "0.1.0"
description = "Minimal CPU benchmark for bottleneck-local candidate splitting"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
